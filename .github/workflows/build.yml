name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP dari bot'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download ZIP
        run: |
          # Download dari URL yang dikirim bot
          wget "${{ github.event.inputs.zip_url }}" -O project.zip
          
      - name: Unzip Project
        run: |
          mkdir -p my_app
          unzip -q project.zip -d my_app
          
          # Pindahin isi folder kalau ternyata di dalamnya ada folder lagi
          if [ -d "my_app/New-main" ]; then
            mv my_app/New-main/* my_app/
            rm -rf my_app/New-main
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        working-directory: ./my_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
