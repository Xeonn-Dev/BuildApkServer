name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: false
        type: string
      userId:
        required: false
        type: string
      payload:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔍 STEP 1: DEBUG — Liat apa yang dikirim bot
      - name: Debug Info
        run: |
          echo "=== JOB ID ==="
          echo "${{ github.event.inputs.jobId }}"
          echo "=== USER ID ==="
          echo "${{ github.event.inputs.userId }}"
          echo "=== PAYLOAD (200 chars) ==="
          echo "${{ github.event.inputs.payload }}" | head -c 200
          echo ""
          echo "=== ISI REPO ==="
          ls -la
          echo "=== SEMUA FILE (non-git) ==="
          find . -type f -not -path "./.git/*" | head -30
          echo "=== GIT LOG ==="
          git log --oneline -5

      # 📦 STEP 2: Dapetin ZIP dari berbagai sumber
      - name: Acquire ZIP
        run: |
          PAYLOAD="${{ github.event.inputs.payload }}"
          FOUND=false

          # Strategi 1: Payload adalah URL
          if [[ "$PAYLOAD" == http* ]]; then
            echo "🔗 Payload adalah URL, download..."
            wget -q "$PAYLOAD" -O project.zip && [ -s project.zip ] && FOUND=true
          fi

          # Strategi 2: Cari ZIP di repo
          if [ "$FOUND" = "false" ]; then
            echo "🔍 Cari ZIP di repo..."
            ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -type f ! -path "*/node_modules/*" | head -1)
            if [ ! -z "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              cp "$ZIP_FILE" project.zip
              FOUND=true
            fi
          fi

          # Strategi 3: Payload base64
          if [ "$FOUND" = "false" ] && [ ! -z "$PAYLOAD" ] && [ ${#PAYLOAD} -gt 100 ]; then
            echo "🔍 Coba decode base64..."
            echo "$PAYLOAD" | base64 -d > project.zip 2>/dev/null || true
            [ -s project.zip ] && file project.zip | grep -qi "zip" && FOUND=true
          fi

          if [ "$FOUND" = "false" ]; then
            echo "❌ GAGAL: ZIP tidak ditemukan di mana pun!"
            echo "Panjang payload: ${#PAYLOAD}"
            exit 1
          fi

          echo "✅ project.zip siap"
          ls -lh project.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Extract ZIP
        run: |
          unzip -q project.zip -d my_app
          echo "=== ISI my_app ==="
          ls -la my_app

      - name: Find pubspec.yaml
        id: detect
        run: |
          PUBSPEC=$(find my_app -name "pubspec.yaml" -type f | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            find my_app -type f | head -30
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project dir: $PROJECT_DIR"

      - name: Pin font_awesome_flutter
        run: |
          cd $PROJECT_DIR
          sed -i 's|font_awesome_flutter:.*|font_awesome_flutter: 10.10.0|g' pubspec.yaml

      - name: Get Dependencies
        run: |
          cd $PROJECT_DIR
          flutter pub get

      - name: Build APK
        run: |
          cd $PROJECT_DIR
          flutter build apk --release --no-tree-shake-icons

      - name: Find APK
        run: find my_app -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-release
          path: my_app/**/*.apk
          if-no-files-found: error
          retention-days: 1
