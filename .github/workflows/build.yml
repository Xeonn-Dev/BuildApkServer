name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ✅ FLUTTER 3.35.X = Dart 3.9 (pas di tengah-tengah)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Extract ZIP
        run: |
  # Cari file zip apapun namanya, lalu unzip
  ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
  if [ -z "$ZIP_FILE" ]; then echo "❌ File ZIP tidak ditemukan"; exit 1; fi
  unzip -q "$ZIP_FILE" -d my_app

      - name: Find pubspec.yaml
        id: detect
        run: |
          PUBSPEC=$(find my_app -name "pubspec.yaml" -type f | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project dir: $PROJECT_DIR"

      # ✅ PIN FONT_AWESOME_FLUTTER KE VERSI STABIL
      - name: Pin font_awesome_flutter version
        run: |
          cd $PROJECT_DIR
          echo "=== SEBELUM ==="
          grep -n "font_awesome_flutter" pubspec.yaml || echo "tidak ada"
          
          # Ganti versi ke 10.10.0 (stabil di Flutter 3.35)
          sed -i 's|font_awesome_flutter:.*|font_awesome_flutter: 10.10.0|g' pubspec.yaml
          
          echo "=== SESUDAH ==="
          grep -n "font_awesome_flutter" pubspec.yaml || echo "tidak ada"
          echo ""
          echo "=== ISI PUBSPEC LENGKAP ==="
          cat pubspec.yaml

      - name: Get Dependencies
        run: |
          cd $PROJECT_DIR
          flutter pub get

      - name: Build APK
        run: |
          cd $PROJECT_DIR
          flutter build apk --release --no-tree-shake-icons

      - name: Find APK
        run: |
          echo "=== SEMUA FILE APK ==="
          find my_app -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-release
          path: my_app/**/*.apk
          if-no-files-found: error
          retention-days: 1
