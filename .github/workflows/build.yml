name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ AUTO-DETECT ZIP: cari file ZIP apa pun di repo
      - name: Find & Rename ZIP
        run: |
          echo "=== ISI ROOT REPO ==="
          ls -la
          echo ""
          echo "=== CARI FILE ZIP ==="
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -type f ! -path "*/node_modules/*" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Tidak ada file ZIP di repo!"
            exit 1
          fi
          echo "✅ ZIP ditemukan: $ZIP_FILE"
          # Rename jadi project.zip biar seragam
          cp "$ZIP_FILE" project.zip
          ls -lh project.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Extract ZIP
        run: |
          unzip -q project.zip -d my_app
          echo "=== ISI my_app ==="
          ls -la my_app

      - name: Find pubspec.yaml
        id: detect
        run: |
          PUBSPEC=$(find my_app -name "pubspec.yaml" -type f | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan di dalam ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project dir: $PROJECT_DIR"

      - name: Pin font_awesome_flutter version
        run: |
          cd $PROJECT_DIR
          sed -i 's|font_awesome_flutter:.*|font_awesome_flutter: 10.10.0|g' pubspec.yaml

      - name: Get Dependencies
        run: |
          cd $PROJECT_DIR
          flutter pub get

      - name: Build APK
        run: |
          cd $PROJECT_DIR
          flutter build apk --release --no-tree-shake-icons

      - name: Find APK
        run: |
          echo "=== SEMUA FILE APK ==="
          find my_app -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-release
          path: my_app/**/*.apk
          if-no-files-found: error
          retention-days: 1
